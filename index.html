<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="DJ Moe d finest - DJ, Producer and Recording Artist. Official website for music, bookings and social media.">

    <meta name="keywords"
          content="DJ Moe d finest, DJ, Producer, Recording Artist, Afrobeats, Afropop, Amapiano, Hip-Hop">

    <meta name="author"
          content="DJ Moe d finest">

    <meta name="theme-color"
          content="#050505">

    <title>DJ Moe d finest | Official Website</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            line-height: 1.6;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
            padding: 22px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(218, 177, 45, 0.30);
            background: #050505;
        }


        .header-name {
            color: #dcb438;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 88vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 50px 20px 70px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(218, 177, 45, 0.09),
                    transparent 55%
                );
        }


        /* =========================
           LOGO
        ========================= */

        .site-logo {
            width: min(420px, 85vw);
            height: auto;

            display: block;

            margin: 0 auto 35px;

            object-fit: contain;
        }


        /* =========================
           HERO TEXT
        ========================= */

        .official {
            color: #dcb438;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 6px;

            margin-bottom: 18px;
        }


        h1 {
            font-size: clamp(42px, 9vw, 78px);

            line-height: 1.05;

            font-weight: 800;

            margin-bottom: 20px;
        }


        .subtitle {
            color: #dddddd;

            font-size: 22px;

            margin-bottom: 12px;
        }


        .genres {
            color: #999999;

            font-size: 17px;

            margin-bottom: 35px;
        }


        /* =========================
           MUSIC BUTTON
        ========================= */

        .music-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 250px;

            padding: 16px 32px;

            border-radius: 50px;

            background: #dcb438;

            color: #050505;

            text-decoration: none;

            font-size: 16px;

            font-weight: 800;

            transition: all 0.3s ease;
        }


        .music-button:hover {
            transform: translateY(-4px);

            background: #f0cc52;

            box-shadow:
                0 10px 30px rgba(220, 180, 56, 0.20);
        }


        /* =========================
           SOCIAL SECTION
        ========================= */

        .social-section {

            padding: 85px 20px;

            text-align: center;

            border-top:
                1px solid rgba(218, 177, 45, 0.20);
        }


        .social-section h2 {

            font-size: clamp(34px, 7vw, 48px);

            margin-bottom: 10px;
        }


        .social-description {

            color: #999999;

            font-size: 17px;

            margin-bottom: 35px;
        }


        /* =========================
           SOCIAL ICONS
        ========================= */

        .social-icons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 22px;

            flex-wrap: wrap;
        }


        .social-icon {

            width: 68px;

            height: 68px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1px solid #dcb438;

            border-radius: 50%;

            color: #ffffff;

            background: #101010;

            text-decoration: none;

            transition: all 0.3s ease;
        }


        .social-icon:hover {

            background: #dcb438;

            color: #050505;

            transform: translateY(-6px);

            box-shadow:
                0 10px 25px rgba(220, 180, 56, 0.20);
        }


        .social-icon svg {

            width: 30px;

            height: 30px;

            fill: currentColor;
        }


        /* =========================
           CONTACT
        ========================= */

        .contact-section {

            text-align: center;

            padding: 20px 20px 80px;
        }


        .contact-section h2 {

            font-size: 34px;

            margin-bottom: 25px;
        }


        .contact-info {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;
        }


        .contact-link {

            color: #bbbbbb;

            text-decoration: none;

            font-size: 17px;

            transition: 0.3s;
        }


        .contact-link:hover {

            color: #dcb438;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            padding: 30px 20px;

            border-top:
                1px solid rgba(218, 177, 45, 0.20);

            color: #666666;

            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {

                padding: 20px 15px;
            }


            .header-name {

                font-size: 16px;

                letter-spacing: 3px;
            }


            .hero {

                min-height: 85vh;

                padding:
                    45px 18px 60px;
            }


            .site-logo {

                width: min(330px, 85vw);

                margin-bottom: 30px;
            }


            .official {

                font-size: 12px;

                letter-spacing: 4px;
            }


            h1 {

                font-size: 44px;
            }


            .subtitle {

                font-size: 18px;
            }


            .genres {

                font-size: 14px;
            }


            .music-button {

                width: 90%;

                max-width: 330px;
            }


            .social-section {

                padding:
                    70px 20px;
            }


            .social-icon {

                width: 62px;

                height: 62px;
            }


            .social-icon svg {

                width: 27px;

                height: 27px;
            }

        }

    </style>

</head>
